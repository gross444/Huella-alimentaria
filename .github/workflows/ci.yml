name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore ./backend
      - run: dotnet build ./backend --configuration Release --no-restore
      - run: dotnet test ./backend --no-build --verbosity normal || true
      - name: dotnet format
        run: dotnet tool install -g dotnet-format || true && ~/.dotnet/tools/dotnet-format --verify-no-changes || true
